name: Build SoThuChi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # NÂNG CẤP LÊN JDK 17 (Hoặc JDK 21 nếu dự án của bạn đời mới) để tránh lỗi cú pháp Java không tương thích
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true 

      - name: Fix Missing Icon Resource
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          COLORS_FILE="app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS_FILE" ]; then
            mkdir -p "app/src/main/res/values"
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$COLORS_FILE"
            echo '<resources>' >> "$COLORS_FILE"
            echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
            echo '</resources>' >> "$COLORS_FILE"
          else
            if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
              sed -i 's|</resources>|    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>|' "$COLORS_FILE"
            fi
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Không tìm thấy ./gradlew, đang khởi tạo nhanh Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # CẤU HÌNH TOÀN DIỆN ÉP SỬA LỖI MÃ HÓA TIẾNG VIỆT TRONG PROPERTIES
          > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties
          
          # ÉP JAVAC KHÔNG ĐƯỢC GIẤU LỖI, IN THẲNG RA ĐỂ NGƯỜI DÙNG NHÌN THẤY NGAY
          if [ -f "app/build.gradle" ]; then
            echo -e "\ngradle.projectsEvaluated {\n    tasks.withType(JavaCompile) {\n        options.compilerArgs << \"-Xlint:unchecked\" << \"-Xlint:deprecation\"\n        options.encoding = 'UTF-8'\n        options.fork = false\n    }\n}" >> app/build.gradle
          fi
          
          ./gradlew clean
          
          # CHẠY LỆNH BUILD ÉP IN RA TỪNG DÒNG LOG SAI SÓT CỦA FILE JAVA
          ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.logging.level=lifecycle || {
             echo "=========================================================================="
             echo "❌ PHÁT HIỆN LỖI TRONG CODE LOGIC TRONG FILE JAVA HOẶC KOTLIN!"
             echo "=========================================================================="
             exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
