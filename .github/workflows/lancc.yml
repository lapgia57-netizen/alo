name: Build SoThuChi APK (Ultimate Fix)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Inject Missing Colors Safely
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          COLORS_DIR="app/src/main/res/values"
          mkdir -p "$COLORS_DIR"
          COLORS_FILE="$COLORS_DIR/colors.xml"

          if [ ! -f "$COLORS_FILE" ] || [ ! -s "$COLORS_FILE" ]; then
            # Nếu file hoàn toàn trống hoặc không tồn tại, khởi tạo chuẩn cấu trúc XML
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$COLORS_FILE"
            echo '<resources>' >> "$COLORS_FILE"
            echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
            echo '</resources>' >> "$COLORS_FILE"
            echo "✅ Đã tạo mới hoàn toàn file colors.xml hợp lệ."
          else
            # Nếu file đã tồn tại, kiểm tra xem đã có key màu hệ thống đòi hỏi chưa
            if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
              # Xóa bỏ thẻ đóng cuối cùng tạm thời để chèn chuẩn xác vào cuối khối tài nguyên
              sed -i 's|</resources>||g' "$COLORS_FILE"
              echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
              echo '</resources>' >> "$COLORS_FILE"
              echo "✅ Đã chèn bổ sung an toàn ic_launcher_background vào colors.xml gốc."
            fi
          fi

      - name: Fix AAPT Cruncher Issues (Tối ưu hóa tài nguyên)
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          GRADLE_PROPERTIES="gradle.properties"
          # Tắt tính năng nén PNG cũ của AAPT nhằm tránh crash bước processDebugResources do lỗi định dạng ảnh
          echo "android.useNewCruncher=false" >> "$GRADLE_PROPERTIES"
          echo "android.aaptOptions.cruncherEnabled=false" >> "$GRADLE_PROPERTIES"
          echo "✅ Đã tối ưu hóa cấu hình tài nguyên AAPT chống crash."

      - name: Setup Gradle Wrapper Stability
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Khởi tạo Gradle Wrapper ==="
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew

      - name: Setup Gradle Action Caches
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true
          add-job-summary: 'always'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew clean assembleDebug --stacktrace --warning-mode=none

      - name: List Generated APKs
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Kiểm tra danh sách file xuất bản ==="
          find . -name "*.apk" || echo "Không tìm thấy file APK nào!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
