name: Build SoThuChi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Thiết lập cấu hình JDK 17 chuẩn hóa cho hệ thống
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true 

      # Tự động chèn màu background bị thiếu cho Icon
      - name: Fix Missing Icon Resource
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          COLORS_FILE="app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS_FILE" ]; then
            mkdir -p "app/src/main/res/values"
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$COLORS_FILE"
            echo '<resources>' >> "$COLORS_FILE"
            echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
            echo '</resources>' >> "$COLORS_FILE"
          else
            if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
              sed -i 's|</resources>|    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>|' "$COLORS_FILE"
            fi
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Không tìm thấy ./gradlew, đang khởi tạo nhanh Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 1. ĐỒNG BỘ CẤU HÌNH BIÊN DỊCH TRONG GRADLE PROPERTIES
          > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties
          
          # 2. ÉP TRÌNH BIÊN DỊCH JAVA SHOW LỖI RA CONSOLE (SỬA LỖI ẨN LOG CỦA GRADLE 8.X)
          # Thao tác chèn code cấu hình hiển thị lỗi trực tiếp vào build.gradle gốc của app
          if [ -f "app/build.gradle" ]; then
            echo -e "\ngradle.projectsEvaluated {\n    tasks.withType(JavaCompile) {\n        options.compilerArgs << \"-Xmaxerrs\" << \"500\"\n    }\n}" >> app/build.gradle
          fi

          ./gradlew clean
          
          # 3. KÍCH HOẠT LỆNH BIÊN DỊCH CHỐNG ẨN LOG
          ./gradlew assembleDebug --stacktrace --no-daemon || {
             echo "=========================================================================="
             echo "❌ PHÁT HIỆN LỖI CODE: ĐANG DUMP CHI TIẾT FILE BỊ LỖI RA TERMINAL..."
             echo "=========================================================================="
             # Lệnh quét sâu tìm kiếm chính xác file Java/Kotlin chứa từ khóa báo lỗi của compiler
             find . -name "reports" -type d -exec grep -rni "error:" {} + 2>/dev/null || true
             find . -name "*.log" -exec grep -ni "error:" {} + 2>/dev/null || true
             exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
