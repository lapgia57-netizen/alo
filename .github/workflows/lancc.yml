name: Build SoThuChi APK Fast

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK Fast
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Giảm timeout xuống thấp để tránh treo tiến trình độc hại
    
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sử dụng JDK 17 (Bản chạy máy ảo Gradle nhanh nhất hiện tại)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Gradle Action Caches (Tăng tốc độ tải dependencies)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true
          add-job-summary: 'never' # Tắt báo cáo để tiết kiệm thời gian

      - name: Inject Speed & Compatibility Properties
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          GRADLE_PROPERTIES="gradle.properties"
          # Ép Gradle chạy đa luồng và lưu cache cấu hình để tăng tốc 50%
          echo "org.gradle.parallel=true" >> "$GRADLE_PROPERTIES"
          echo "org.gradle.configuration-cache=true" >> "$GRADLE_PROPERTIES"
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> "$GRADLE_PROPERTIES"
          # Sửa lỗi màu nền hệ thống nếu thiếu để tránh AAPT2 bị dừng đột ngột
          mkdir -p "app/src/main/res/values"
          COLORS_FILE="app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS_FILE" ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>' > "$COLORS_FILE"
          fi

      - name: Fast Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        # Chạy trực tiếp lệnh assembleDebug loại bỏ build sạch (clean) để tận dụng cache cũ tối đa nếu có
        # Thêm cờ --offline nếu bạn muốn ép hệ thống không tải lại thư viện mạng (nếu cache đã đủ)
        run: ./gradlew assembleDebug --daemon --parallel --configuration-cache --warning-mode=none

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Fast-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
