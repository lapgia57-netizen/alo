name: Build SoThuChi APK (Strict Fix)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Clear and Recreate Clean Colors Resource
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          # Xóa bỏ hoàn toàn file cũ để tránh việc lệnh sed trước đó chèn đè làm hỏng cú pháp XML
          mkdir -p "app/src/main/res/values"
          COLORS_FILE="app/src/main/res/values/colors.xml"
          echo '<?xml version="1.0" encoding="utf-8"?>' > "$COLORS_FILE"
          echo '<resources>' >> "$COLORS_FILE"
          echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
          echo '</resources>' >> "$COLORS_FILE"
          echo "✅ Đã khởi tạo lại file colors.xml chuẩn cấu trúc."

      - name: Setup & Downgrade Gradle Wrapper for Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          # Ép hệ thống tạo Wrapper với bản Gradle 8.7 (Bản ổn định nhất hiện tại, tránh lỗi nghiêm trọng của Gradle 9/10)
          echo "=== Cấu hình Gradle Wrapper tương thích ==="
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew

      - name: Setup Gradle Action Caches
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true
          add-job-summary: 'always'

      - name: Strict Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        # Thêm --warning-mode=all để hiển thị chi tiết nếu có lỗi và ép chạy sạch hoàn toàn
        run: ./gradlew clean assembleDebug --stacktrace --warning-mode=all

      - name: List Generated APKs
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Kiểm tra vị trí file APK đã xuất ==="
          find . -name "*.apk" || echo "Không tìm thấy file APK nào!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
