name: Build SoThuChi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true 

      # BƯỚC SỬA LỖI: Tự động chèn resource màu bị thiếu nếu file colors.xml không có
      - name: Fix Missing Icon Resource
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          COLORS_FILE="app/src/main/res/values/colors.xml"
          
          # 1. Tạo thư mục và file colors.xml cơ bản nếu hoàn toàn không tồn tại
          if [ ! -f "$COLORS_FILE" ]; then
            mkdir -p "app/src/main/res/values"
            echo '<?xml version="1.0" encoding="utf-8"?>' > $COLORS_FILE
            echo '<resources>' >> $COLORS_FILE
            echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> $COLORS_FILE
            echo '</resources>' >> $COLORS_FILE
            echo "✅ Đã tạo mới file colors.xml và thêm ic_launcher_background"
          else
            # 2. Nếu file tồn tại nhưng chưa có mã màu ic_launcher_background thì chèn vào trước thẻ đóng </resources>
            if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
              sed -i 's|</resources>|    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>|' $COLORS_FILE
              echo "✅ Đã tự động chèn ic_launcher_background vào colors.xml"
            else
              echo "ℹ️ Biến ic_launcher_background đã tồn tại sẵn."
            fi
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          # 1. Khởi tạo nhanh Gradle Wrapper nếu dự án bị thiếu file gradlew
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Không tìm thấy ./gradlew, đang khởi tạo nhanh Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          
          # 2. Cấp quyền thực thi cho script wrapper
          chmod +x ./gradlew
          
          # 3. Tạo cấu hình môi trường Android SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 4. TỰ ĐỘNG CẤU HÌNH SỬA LỖI ANDROIDX TẠI ĐÂY
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "✅ Đã tự động kích hoạt android.useAndroidX trong gradle.properties"
          
          # 5. Chạy lệnh đóng gói (Build) thành file APK
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
