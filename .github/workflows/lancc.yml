name: Build SoThuChi APK
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          # Tự động tạo Gradle Wrapper nếu dự án của bạn thiếu file gradlew
          generate-submit-arguments: true 

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          # 1. Nếu thiếu wrapper, tiến hành khởi tạo nhanh thông qua lệnh gradle có sẵn của môi trường
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Không tìm thấy ./gradlew, đang khởi tạo nhanh Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          
          # 2. Cấp quyền thực thi và tạo cấu hình môi trường
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 3. Chạy lệnh Build APK
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
