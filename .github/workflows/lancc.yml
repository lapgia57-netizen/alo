name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline
          else
            npm install
          fi
          # Đảm bảo Capacitor Android có sẵn
          npm install @capacitor/android@^6.2.0 --save

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept licenses + cài platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" >/dev/null 2>&1 || true

      - name: Web build
        run: npm run build --if-present

      # ========== FIX QUAN TRỌNG CHO CAP SYNC ==========
      - name: Add Android platform (nếu chưa có)
        run: |
          if [ ! -d "android" ]; then
            echo "→ Thư mục android chưa có, đang thêm..."
            npx cap add android
          else
            echo "→ Thư mục android đã tồn tại"
          fi

      - name: Sync Capacitor (copy web assets + update native)
        run: |
          echo "→ Đang sync Capacitor..."
          npx cap sync android
          echo "→ Sync xong. Kiểm tra thư mục assets:"
          ls -la android/app/src/main/assets/public/ || true

      - name: Tạo local.properties (tránh lỗi SDK location)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cat android/local.properties

      - name: Tối ưu Gradle
        run: |
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: so-thu-chi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Hiển thị kích thước APK
        run: find android -name "*.apk" -type f -exec ls -lh {} \;
