name: Build SoThuChi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Cấu hình môi trường Java 17 chuẩn hóa
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Tự động tìm thư mục gốc chứa dự án Android
      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      # 3. Khởi tạo cấu hình Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true

      # 4. Tự động sửa lỗi thiếu tài nguyên Icon cũ nếu có
      - name: Fix Missing Icon Resource
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          COLORS_FILE="app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS_FILE" ]; then
            mkdir -p "app/src/main/res/values"
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$COLORS_FILE"
            echo '<resources>' >> "$COLORS_FILE"
            echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
            echo '</resources>' >> "$COLORS_FILE"
          else
            if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
              sed -i 's|</resources>|    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>|' "$COLORS_FILE"
            fi
          fi

      # 5. Build dự án dựa trên cấu hình mã nguồn cũ gốc
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Không tìm thấy ./gradlew, đang khởi tạo nhanh Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # THÀNH PHẦN THAY ĐỔI: Hoàn toàn KHÔNG can thiệp/KHÔNG tạo mới file gradle.properties bừa bãi nữa.
          # Để cho hệ thống tự đọc file gradle.properties cũ trong repository (nếu có).
          
          ./gradlew clean
          
          echo "🚀 Đang ép xuất danh sách lỗi biên dịch Java gốc..."
          # Chạy biên dịch độc lập và bắt toàn bộ lỗi vào file văn bản (phòng trường hợp code cũ thực sự có lỗi)
          ./gradlew compileDebugJavaWithJavac --no-daemon > full_java_errors.txt 2>&1 || true
          
          # Thực hiện lệnh tạo APK chính thức
          ./gradlew assembleDebug --no-daemon

      # 6. Tự động tải file chứa lỗi lên mục Artifacts nếu quá trình biên dịch thất bại
      - name: Upload Compilation Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Java-Compilation-Errors
          path: '${{ env.PROJECT_DIR }}/full_java_errors.txt'
          retention-days: 7

      # 7. Xuất bản tệp APK lên mục Artifacts nếu build thành công mĩ mãn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
