name: Build Debug APK (Native Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Create missing resources & configs
        run: |
          set -e

          # 1. Dummy google-services.json (Firebase plugin requires this file)
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-sothuchi",
              "storage_bucket": "dummy-sothuchi.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.moneytp.sothuchi"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCIBuildOnly1234567890"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSEOF

          # 2. Minimal mipmap icons (manifest requires @mipmap/ic_launcher)
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$dens
            echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > app/src/main/res/mipmap-$dens/ic_launcher.png
            cp app/src/main/res/mipmap-$dens/ic_launcher.png app/src/main/res/mipmap-$dens/ic_launcher_round.png
          done

          # 3. strings.xml
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'STREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Sổ Thu Chi</string>
          </resources>
          STREOF

          # 4. themes.xml
          cat > app/src/main/res/values/themes.xml << 'THEMEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SoThuChi" parent="Theme.MaterialComponents.DayNight.DarkActionBar">
                  <item name="colorPrimary">@color/purple_500</item>
                  <item name="colorPrimaryVariant">@color/purple_700</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSecondary">@color/teal_200</item>
                  <item name="colorOnSecondary">@color/black</item>
              </style>
          </resources>
          THEMEOF

          # 5. Gradle wrapper 8.2 (compatible with AGP 8.2)
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'WPEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WPEOF

          # 6. Create gradlew if missing
          if [ ! -f gradlew ]; then
            curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew -o gradlew
            chmod +x gradlew
          fi

          # 7. local.properties
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

          echo ">>> All missing files created successfully"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo ">>> APK built successfully"

      - name: Show APK info
        run: |
          find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;
          file app/build/outputs/apk/debug/app-debug.apk || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: so-thu-chi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
