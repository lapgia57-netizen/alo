name: Build SoThuChi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Cấu hình môi trường Java 17 chuẩn hóa
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Tự động tìm thư mục gốc chứa dự án Android
      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      # 3. ÉP TẮT HOÀN TOÀN TÍNH NĂNG GOM LOG VÀ HIỂN THỊ CỦA GRADLE ACTIONS
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true
          # ĐÂY LÀ CHÌA KHÓA: Buộc GitHub Actions không được gom nhóm hoặc ẩn log thô
          add-job-summary: 'never'
          arguments: '--no-daemon'

      # 4. Tự động sửa lỗi tài nguyên màu nền Icon (Tránh lỗi vặt AAPT2)
      - name: Fix Missing Icon Resource
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          COLORS_FILE="app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS_FILE" ]; then
            mkdir -p "app/src/main/res/values"
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$COLORS_FILE"
            echo '<resources>' >> "$COLORS_FILE"
            echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
            echo '</resources>' >> "$COLORS_FILE"
          else
            if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
              sed -i 's|</resources>|    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>|' "$COLORS_FILE"
            fi
          fi

      # 5. Ép chạy Javac độc lập và lưu log lỗi tuyệt đối
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Không tìm thấy ./gradlew, đang khởi tạo nhanh Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Không can thiệp ghi đè file thuộc tính nữa để tránh xung đột mã nguồn cũ
          ./gradlew clean
          
          echo "🚀 Tiến hành biên dịch Java..."
          # Chạy tác vụ compile độc lập, chuyển hướng toàn bộ luồng lỗi ra file text thô
          ./gradlew compileDebugJavaWithJavac --stacktrace --no-daemon > raw_compilation_errors.txt 2>&1 || true
          
          # Chạy bản dựng chính thức để kết thúc trạng thái
          ./gradlew assembleDebug --no-daemon

      # 6. BƯỚC THẦN KỲ: Đọc file thô và in đè lên màn hình bất chấp bộ lọc của plugin
      - name: Force Print 44 Java Errors to Console
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================================================"
          echo "🚨 PHÁT HIỆN BIÊN DỊCH THẤT BẠI! ĐÂY LÀ TOÀN BỘ 44 LỖI TRONG CODE JAVA CỦA BẠN:"
          echo "======================================================================"
          if [ -f "raw_compilation_errors.txt" ]; then
            # Dùng grep để lọc ra đúng các dòng chứa mã lỗi thật (loại bỏ log thừa của hệ thống)
            grep -E "error:|: error|cannot find symbol|package.*does not exist" raw_compilation_errors.txt || cat raw_compilation_errors.txt
          else
            echo "Không tìm thấy file lưu log lỗi raw_compilation_errors.txt!"
          fi
          echo "======================================================================"

      # 7. Lưu file lỗi về máy phòng hờ
      - name: Upload Error Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Java-Compilation-Errors
          path: '${{ env.PROJECT_DIR }}/raw_compilation_errors.txt'
          retention-days: 5

      # 8. Xuất file APK lên mục Artifacts nếu thành công
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
