name: Build Debug APK (Native Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Create missing resources & configs
        run: |
          set -e
          mkdir -p app/src/main/res/values
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$dens
          done
          
          python3 -c '
          import os, base64
          # 1. google-services.json
          open("app/google-services.json","w").write("""{
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-sothuchi",
              "storage_bucket": "://appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                "android_client_info": {"package_name": "com.moneytp.sothuchi"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDummyKeyForCIBuildOnly1234567890"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          """)
          
          # 2. colors.xml
          open("app/src/main/res/values/colors.xml","w").write("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_500">#4f46e5</color>
              <color name="purple_700">#1e1b4b</color>
              <color name="teal_200">#6ee7b7</color>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="rose_600">#e11d48</color>
              <color name="emerald_600">#059669</color>
          </resources>
          """)
          
          # 3. strings.xml
          open("app/src/main/res/values/strings.xml","w").write("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">So Thu Chi</string>
          </resources>
          """)
          
          # 4. Icons
          png = base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==")
          for dens in ["mdpi","hdpi","xhdpi","xxhdpi","xxxhdpi"]:
              open(f"app/src/main/res/mipmap-{dens}/ic_launcher.png","wb").write(png)
              open(f"app/src/main/res/mipmap-{dens}/ic_launcher_round.png","wb").write(png)
          
          # 5. local.properties
          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT","")
          open("local.properties","w").write(f"sdk.dir={sdk}\n")
          print(">>> Resources & Configs OK")
          '

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle Wrapper Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "ERROR: Không tìm thấy file gradlew ở thư mục gốc của repo!"
            exit 1
          fi
          chmod +x gradlew
          echo ">>> Cấp quyền thực thi thành công cho ./gradlew"

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo ">>> APK đã được tạo thành công!"

      - name: Show APK info
        run: |
          find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;
          file app/build/outputs/apk/debug/app-debug.apk || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: so-thu-chi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
