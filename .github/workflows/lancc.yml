name: Build SoThuChi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept licenses + install platform 34
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Path + Create Wrapper + Build
        shell: bash
        run: |
          # Tìm thư mục gốc chứa settings.gradle
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle"
            exit 1
          fi
          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          echo "➡️ Project root: $TARGET_DIR"
          cd "$TARGET_DIR"

          # Tạo local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Tạo Gradle Wrapper 8.4 nếu chưa có
          if [ ! -f "./gradlew" ]; then
            echo "→ Đang tạo Gradle Wrapper 8.4..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

          # Build
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
