name: Build SoThuChi APK Fast

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK Fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dùng JDK 17 cho hiệu năng biên dịch tối ưu nhất
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Gradle Action Caches
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true
          add-job-summary: 'never'

      - name: Inject Configuration & Avoid File Crashes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          GRADLE_PROPERTIES="gradle.properties"
          # Kích hoạt đa luồng tăng tốc độ xử lý phần cứng lên tối đa
          echo "org.gradle.parallel=true" >> "$GRADLE_PROPERTIES"
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> "$GRADLE_PROPERTIES"
          
          # Fix cứng tệp colors nếu thiếu để dọn đường cho AAPT biên dịch giao diện
          mkdir -p "app/src/main/res/values"
          COLORS_FILE="app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS_FILE" ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>' > "$COLORS_FILE"
          fi

      # TRÁNH LỖI 127: Sử dụng lệnh hệ thống độc lập để tạo / cập nhật wrapper tự động
      - name: Auto Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Khởi tạo lệnh Gradle cục bộ để bypass lỗi thiếu file ==="
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew

      - name: Fast Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        # Thực hiện đóng gói sử dụng đa luồng song song mà không dọn cache cũ (bỏ lệnh clean để tăng tốc)
        run: ./gradlew assembleDebug --parallel --warning-mode=none

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Fast-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
