name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline
          else
            npm install
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ========== FIX QUAN TRỌNG ==========
      # Dùng v4 (đã bỏ package "tools" bị Google gỡ)
      # hoặc chỉ cài platform-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android licenses + cài platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # Cài những thứ Capacitor thường cần
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" || true

      - name: Web build (nếu có)
        run: npm run build --if-present

      - name: Add Android platform (nếu chưa có)
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Tối ưu Gradle
        run: |
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: so-thu-chi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Hiển thị kích thước APK
        run: |
          echo "=== APK đã build ==="
          find android -name "*.apk" -type f -exec ls -lh {} \;
