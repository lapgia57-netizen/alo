name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ĐÃ SỬA: Nâng cấp từ JDK 11 lên JDK 17 để tương thích với Gradle 8.x
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ĐÃ SỬA: Nâng cấp Gradle Setup từ 7.5 lên 8.2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # ĐÃ SỬA: Thay thế tham số tạo wrapper từ 7.5 thành 8.2 tương ứng
      - name: Build Debug APK
        run: |
          # Chuyển vào thư mục SoThuChiJava nếu code nằm trong thư mục con
          if [ -d "SoThuChiJava" ]; then
            cd SoThuChiJava
          fi

          # Tự động tạo wrapper nếu chưa có với phiên bản 8.2
          gradle wrapper --gradle-version 8.2
          
          # Cấp quyền và build APK
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
