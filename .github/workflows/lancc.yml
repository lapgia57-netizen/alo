name: Build SoThuChi APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. Tải mã nguồn từ GitHub Repository về máy ảo
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Cấu hình môi trường Java (bắt buộc JDK 17)
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # 3. Cài Android SDK + platform 34 (bắt buộc để build)
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept licenses + install platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      # ============================================================
      # 4. Tự động định vị Root Project + Build APK
      # ============================================================
      - name: Fix Path and Build Android App
        shell: bash
        run: |
          echo "=====[ 1. TỰ ĐỘNG DÒ TÌM THƯ MỤC GỐC DỰ ÁN ]====="
          # Tìm file settings.gradle để xác định chính xác thư mục gốc
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "⚠️ Không thấy settings.gradle, thử tìm build.gradle ở tầng cao nhất..."
            SETTINGS_FILE=$(find . -name "build.gradle" | sort | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ LỖI: Không định vị được cấu trúc dự án Android!"
            exit 1
          fi

          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          echo "➡️ Thư mục gốc dự án được xác định tại: $TARGET_DIR"
          cd "$TARGET_DIR"

          echo "=====[ 2. TẠO local.properties ]====="
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

          echo "=====[ 3. KHỞI TẠO HOẶC CẤP QUYỀN GRADLE WRAPPER V8.4 ]====="
          if [ -f "./gradlew" ]; then
            echo "-> Tìm thấy gradlew có sẵn, tiến hành cấp quyền thực thi..."
            chmod +x ./gradlew
          else
            echo "-> Tự động tạo cấu hình Gradle Wrapper bản ổn định 8.4..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

          echo "=====[ 4. TIẾN HÀNH BIÊN DỊCH FILE APK ]====="
          ./gradlew assembleDebug --stacktrace --no-daemon

      # ============================================================
      # 5. Đóng gói và xuất file APK ra tab Actions
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
