name: Build SoThuChi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sử dụng JDK 17 (hoặc 11) kết hợp với ép biến môi trường mã hóa hệ thống
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true 

      # BƯỚC SỬA LỖI 1: Tự động chèn màu background bị thiếu nếu file colors.xml trống
      - name: Fix Missing Icon Resource
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          COLORS_FILE="app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS_FILE" ]; then
            mkdir -p "app/src/main/res/values"
            echo '<?xml version="1.0" encoding="utf-8"?>' > $COLORS_FILE
            echo '<resources>' >> $COLORS_FILE
            echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> $COLORS_FILE
            echo '</resources>' >> $COLORS_FILE
          else
            if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
              sed -i 's|</resources>|    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>|' $COLORS_FILE
            fi
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        # Ép hệ thống Ubuntu nhận diện tiếng Việt / UTF-8 để Javac không bị lỗi ký tự lạ
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          # 1. Khởi tạo nhanh Gradle Wrapper nếu dự án bị thiếu file gradlew
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Không tìm thấy ./gradlew, đang khởi tạo nhanh Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          
          # 2. Cấp quyền thực thi cho script wrapper
          chmod +x ./gradlew
          
          # 3. Tạo cấu hình môi trường Android SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 4. TỰ ĐỘNG VÁ HỆ THỐNG GRADLE PROPERTIES (Sửa lỗi ép kiểu Javac cũ & AndroidX)
          > gradle.properties # Làm sạch cấu hình tạm thời
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties
          echo "✅ Đã tối ưu hóa thuộc tính biên dịch trong gradle.properties"
          
          # 5. Dọn dẹp cache cục bộ trước khi compile để tránh dính code lỗi cũ
          ./gradlew clean
          
          # 6. Chạy lệnh đóng gói (Build) kèm in log tối đa nếu có lỗi phát sinh
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: error
