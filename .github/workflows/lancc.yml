name: Build SoThuChi APK (Force Java Compiler Logs)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root Directory
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project directory at: $PROJECT_DIR"

      - name: Inject Missing Colors Safely
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          COLORS_DIR="app/src/main/res/values"
          mkdir -p "$COLORS_DIR"
          COLORS_FILE="$COLORS_DIR/colors.xml"

          if [ ! -f "$COLORS_FILE" ] || [ ! -s "$COLORS_FILE" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$COLORS_FILE"
            echo '<resources>' >> "$COLORS_FILE"
            echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
            echo '</resources>' >> "$COLORS_FILE"
          else
            if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
              sed -i 's|</resources>||g' "$COLORS_FILE"
              echo '    <color name="ic_launcher_background">#FFFFFF</color>' >> "$COLORS_FILE"
              echo '</resources>' >> "$COLORS_FILE"
            fi
          fi

      - name: Fix AAPT Cruncher Issues
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          GRADLE_PROPERTIES="gradle.properties"
          echo "android.useNewCruncher=false" >> "$GRADLE_PROPERTIES"
          echo "android.aaptOptions.cruncherEnabled=false" >> "$GRADLE_PROPERTIES"

      - name: Setup Gradle Wrapper Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew

      - name: Setup Gradle Action Caches
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}
          generate-submit-arguments: true
          add-job-summary: 'always'

      - name: Force Build & Print Unformatted Compiler Errors
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== ÉP ĐỌC TRỰC TIẾP LỖI BIÊN DỊCH JAVA CỦA JAVAC ==="
          # Chạy trực tiếp trên console=plain để tránh Gradle ẩn/nén log lỗi của Java compiler
          ./gradlew clean assembleDebug --stacktrace --console=plain --warning-mode=all

      - name: List Generated APKs
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find . -name "*.apk"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
