name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          # Chuyển vào thư mục chứa code nếu thư mục tồn tại
          if [ -d "SoThuChiJava" ]; then
            cd SoThuChiJava
          fi
          
          # Sử dụng Gradle hệ thống để build trực tiếp mà không phụ thuộc vào gradlew
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
