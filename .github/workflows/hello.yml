name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept licenses + cài platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Move into project (nếu code nằm trong thư mục con)
        run: |
          if [ -d "SoThuChiJava" ]; then
            echo "→ Chuyển vào thư mục SoThuChiJava"
            cd SoThuChiJava
            echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV
          fi

      - name: Tạo Gradle Wrapper (nếu chưa có)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "gradlew" ]; then
            echo "→ Tạo Gradle Wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Tạo local.properties
        working-directory: ${{ env.PROJECT_DIR }}
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
