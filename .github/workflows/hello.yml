name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure gradlew exists and grant permissions
        run: |
          # Xác định thư mục chứa dự án (gốc hoặc thư mục SoThuChiJava)
          if [ -d "SoThuChiJava" ]; then
            cd SoThuChiJava
          fi
          
          # Nếu chưa có file gradlew thì tự động khởi tạo bằng Gradle
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          # Cấp quyền thực thi cho gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          if [ -d "SoThuChiJava" ]; then
            cd SoThuChiJava
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/app/build/outputs/apk/debug/*.apk
