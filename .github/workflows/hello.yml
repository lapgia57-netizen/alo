name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Wrapper and Build APK
        run: |
          # Chuyển vào thư mục mã nguồn SoThuChiJava nếu tồn tại
          if [ -d "SoThuChiJava" ]; then
            cd SoThuChiJava
          fi
          
          # Tự động khởi tạo Gradle Wrapper tương thích
          gradle wrapper
          
          # Cấp quyền thực thi cho gradlew vừa tạo
          chmod +x gradlew
          
          # Chạy build Debug APK với JVM 17
          ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
