name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        build-type: >-
          ${{ 
            (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') 
            && fromJSON('["debug", "release"]') 
            || fromJSON('["debug"]') 
          }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Đã sửa: Sử dụng action chính chủ của thiết lập Android giúp tự động nhận diện SDK chuẩn xác hơn
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # Đã sửa: Thêm biến môi trường JAVA_OPTS="" để chặn lỗi "-Xmx64m" khi khởi tạo wrapper
      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then 
            chmod +x gradlew
          else 
            gradle wrapper --gradle-version 8.4 || true
            chmod +x gradlew || true
          fi
        env:
          JAVA_OPTS: ""

      - name: Create local.properties
        run: echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties

      # Đã sửa: Làm sạch môi trường chạy bằng cách truyền cả JAVA_OPTS trống để triệt tiêu bug map bộ nhớ của GitHub runner
      - name: Build APK
        run: |
          if [ "${{ matrix.build-type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-${{ matrix.build-type }}-APK
          path: app/build/outputs/apk/${{ matrix.build-type }}/app-${{ matrix.build-type }}.apk
          retention-days: 14
          if-no-files-found: error
