name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        build-type: >-
          ${{ 
            (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') 
            && fromJSON('["debug", "release"]') 
            || fromJSON('["debug"]') 
          }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Sử dụng Action chính thức để chuẩn bị môi trường Android SDK toàn diện
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Create local.properties
        run: echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties

      # SỬA LỖI TẠI ĐÂY: Dùng trực tiếp lệnh 'gradle' hệ thống thay vì './gradlew' để triệt tiêu lỗi tải Jar tệp tin nén
      - name: Build APK
        run: |
          if [ "${{ matrix.build-type }}" = "debug" ]; then
            gradle assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-${{ matrix.build-type }}-APK
          path: app/build/outputs/apk/${{ matrix.build-type }}/app-${{ matrix.build-type }}.apk
          retention-days: 14
          if-no-files-found: error
