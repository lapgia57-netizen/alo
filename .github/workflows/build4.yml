name: Build Android APK (Debug Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # Fix lỗi biến môi trường rác chèn tham số -Xmx64m trái phép
      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then 
            chmod +x gradlew
          else 
            gradle wrapper --gradle-version 8.4 --validate-url || true
            chmod +x gradlew || true
          fi
        env:
          _JAVA_OPTIONS: ""
          JAVA_OPTS: ""

      - name: Create local.properties
        run: echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties

      # Chỉ build duy nhất bản Debug, bỏ qua câu lệnh điều kiện phức tạp
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          _JAVA_OPTIONS: ""
          JAVA_OPTS: ""
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      # Đóng gói và xuất file Debug APK lên GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
