<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MONEY TP EVERYWHERE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1040/1040249.png" type="image/png">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://tienbothi-default-rtdb.firebaseio.com">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            touch-action: manipulation;
        }
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            contain: layout style;
        }
        .safe-top { padding-top: env(safe-area-inset-top, 20px); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pb-safe-fab { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 90px); }
        .bottom-sheet {
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
            will-change: transform;
            contain: layout paint;
        }
        .bottom-sheet.show { transform: translateY(0); }
        ::-webkit-scrollbar { display: none; width: 0; height: 0; }
        
        /* Tối ưu Oscal Tiger 12 + máy tầm trung */
        @media (max-width: 420px) {
            .text-xs { font-size: 11px; }
            .text-sm { font-size: 13px; }
        }
        input, button, select, textarea {
            font-size: 16px !important;
            -webkit-appearance: none;
        }
        /* GPU acceleration cho list */
        #audit-log-chi, #audit-log-thu {
            contain: content;
            content-visibility: auto;
        }
        .list-item {
            contain: layout style paint;
        }
    </style>
</head>
<body class="bg-slate-50 h-full flex flex-col text-slate-800 select-none">
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex flex-col items-center justify-between h-full px-5 py-8 safe-top safe-bottom overflow-y-auto bg-gradient-to-b from-indigo-900 via-slate-900 to-slate-950 text-white">
        <div class="my-auto text-center w-full max-w-sm">
            <div class="inline-flex items-center justify-center w-18 h-18 bg-indigo-500/10 border border-indigo-500/20 rounded-[2rem] shadow-2xl shadow-indigo-500/20 mb-4 backdrop-blur-md">
                <img src="https://cdn-icons-png.flaticon.com/512/1040/1040249.png" alt="Icon" class="w-9 h-9 brightness-200">
            </div>
            <h1 class="text-xl font-extrabold tracking-tight text-white">Quản Lý Thu Chi</h1>
            <p class="text-indigo-200/70 mt-1 text-xs font-medium mb-6">Hệ thống ghi nhận tài chính & đối soát thông minh</p>
            <div class="space-y-3 bg-white/10 backdrop-blur-xl p-5 rounded-[1.75rem] border border-white/10 shadow-2xl text-left">
                <h2 class="text-[11px] font-bold text-indigo-300 uppercase tracking-wider">Đăng nhập tài khoản Email</h2>
                
                <form onsubmit="handleEmailPasswordAuth(event)" class="space-y-3">
                    <div>
                        <label class="text-[10px] font-semibold text-indigo-200/80 mb-1 block">Địa chỉ Email</label>
                        <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full px-3.5 py-2.5 bg-slate-900/60 border border-white/10 rounded-xl focus:outline-none focus:border-indigo-400 font-medium text-sm text-white placeholder-slate-500 shadow-inner">
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold text-indigo-200/80 mb-1 block">Mật khẩu</label>
                        <input type="password" id="auth-password" required minlength="6" placeholder="Mật khẩu từ 6 ký tự..." class="w-full px-3.5 py-2.5 bg-slate-900/60 border border-white/10 rounded-xl focus:outline-none focus:border-indigo-400 font-medium text-sm text-white placeholder-slate-500 shadow-inner">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button type="submit" onclick="setAuthMode('login')" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all shadow-lg shadow-indigo-600/30 py-2.5 rounded-xl font-bold text-white text-xs">
                            Đăng nhập
                        </button>
                        <button type="submit" onclick="setAuthMode('register')" id="btn-register" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all shadow-lg shadow-emerald-600/30 py-2.5 rounded-xl font-bold text-white text-xs">
                            Đăng ký mới

    </div>
    <!-- MAIN APP -->
    <div id="main-app" class="hidden flex flex-col h-full overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-indigo-950 text-white safe-top shadow-xl z-30 flex-shrink-0 border-b border-indigo-900/50">
            <div class="px-3.5 py-2.5 flex justify-between items-center">
                <div class="flex items-center gap-x-2">

                    <div>
                        <h1 class="text-sm font-extrabold tracking-tight text-white leading-tight">Sổ Thu Chi Cá Nhân</h1>

                </div>

                    <button onclick="logout()" class="text-indigo-300 hover:text-white text-[10px] font-semibold bg-indigo-900/80 hover:bg-rose-900/50 px-2 py-1.5 rounded-lg transition-colors border border-indigo-800/50">Thoát</button>
                </div>
            </div>
            <!-- DASHBOARD BALANCE CARDS -->
            <div class="px-3.5 py-3 grid grid-cols-3 gap-1.5 text-center bg-indigo-900/30 border-t border-indigo-900/40 backdrop-blur-md">
                <div class="border-r border-indigo-800/40 pr-1">
                    <span class="text-[9px] text-emerald-400 font-bold uppercase tracking-wider block">Tổng Thu</span>
                    <div id="audit-total-thu" class="text-xs font-extrabold text-emerald-300 mt-0.5 truncate">0 đ</div>
                </div>
                <div class="border-r border-indigo-800/40 px-1">
                    <span class="text-[9px] text-rose-400 font-bold uppercase tracking-wider block">Tổng Chi</span>
                    <div id="audit-total-chi" class="text-xs font-extrabold text-rose-300 mt-0.5 truncate">0 đ</div>
                </div>
                <div class="pl-1">
                    <span class="text-[9px] text-sky-400 font-bold uppercase tracking-wider block">Khả Dụng</span>
                    <div id="audit-balance" class="text-xs font-extrabold text-sky-300 mt-0.5 truncate">0 đ</div>
                </div>
            </div>
            <!-- TABS -->
            <div class="px-3.5 py-2 bg-indigo-950">
                <div class="bg-indigo-900/60 p-1 rounded-xl flex border border-indigo-800/40">

                        SỔ CHI TIÊU
                    </button>
                    <button onclick="switchTab(1)" id="tab-1" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-indigo-300 bg-transparent">
                        SỔ THU NHẬP
                    </button>
                </div>

        <!-- MAIN CONTENT LIST -->
        <main class="flex-1 overflow-y-auto pb-safe-fab bg-slate-100/70">
            <div id="content-0" class="tab-content hidden">
                <div id="audit-log-chi" class="space-y-2.5 p-3 max-w-2xl mx-auto"></div>
                <div id="pagination-chi" class="flex justify-center gap-1.5 py-3"></div>
            </div>
            
            <div id="content-1" class="tab-content hidden">
                <div id="audit-log-thu" class="space-y-2.5 p-3 max-w-2xl mx-auto"></div>
                <div id="pagination-thu" class="flex justify-center gap-1.5 py-3"></div>
            </div>
        </main>
        <!-- FLOATING ACTION BUTTON -->
        <button onclick="showAddModal()" class="fixed bottom-5 right-4 w-13 h-13 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl flex items-center justify-center shadow-xl shadow-indigo-600/40 active:scale-95 transition-all z-40 safe-bottom border border-indigo-400/20">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </div>
    <!-- MODAL FORM -->
    <div id="modal-backdrop" onclick="hideModal()" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 transition-opacity duration-300 opacity-0"></div>
    <div id="modal" class="bottom-sheet fixed bottom-0 left-0 right-0 bg-white rounded-t-[2rem] z-50 flex flex-col max-h-[92vh] safe-bottom shadow-2xl text-slate-800 max-w-lg mx-auto">
        <div class="w-10 h-1.5 bg-slate-200 rounded-full mx-auto my-2.5 flex-shrink-0 cursor-pointer" onclick="hideModal()"></div>
        <div class="px-5 pb-2.5 flex justify-between items-center border-b border-slate-100">
            <h3 id="modal-title" class="text-sm font-bold text-slate-900">Ghi nhận giao dịch</h3>
            <button onclick="hideModal()" class="text-xs font-bold text-slate-400 hover:text-slate-600 px-2.5 py-1 bg-slate-100 rounded-lg">Hủy</button>
        </div>
        
        <form id="edit-form" onsubmit="handleSubmit(event)" class="p-5 overflow-y-auto space-y-3.5">
            <input type="hidden" id="node-type">
            <input type="hidden" id="edit-key">
            
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Ngày chứng từ</label>
                <input type="date" id="ngay" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 font-semibold text-sm mt-1 shadow-inner">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Danh mục kiểm toán</label>
                <input type="text" id="danh_muc" required maxlength="100" placeholder="Ví dụ: Ăn uống, Lương tháng..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 font-semibold text-sm mt-1 shadow-inner">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Nội dung diễn giải</label>
                <input type="text" id="mo_ta" required maxlength="300" placeholder="Ghi chú chi tiết lý do..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 font-medium text-sm mt-1 shadow-inner">
            </div>
            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Số tiền (đ)</label>
                    <input type="number" id="so_tien" required min="0" max="999999999999" placeholder="0" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 font-bold text-sm mt-1 shadow-inner text-indigo-600">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Mã tham chiếu / Note</label>
                    <input type="text" id="ghi_chu" maxlength="80" placeholder="Số hóa đơn, STK..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 font-medium text-sm mt-1 shadow-inner">
                </div>
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white rounded-xl font-extrabold text-xs tracking-wider shadow-lg shadow-indigo-600/30 transition-all uppercase">
                    Xác Thực Lưu Dữ Liệu
                </button>
            </div>
        </form>
    </div>
    <script>
        // ====================== REALTIME CLOCK ======================
        function startRealtimeClock() {
            function updateClock() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const dateString = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const clockEl = document.getElementById('realtime-clock');
                if (clockEl) {
                    clockEl.textContent = `${timeString} - ${dateString}`;
                }
            }
            updateClock();
            setInterval(updateClock, 1000);
        }
        // ====================== COOKIES UTILS ======================
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
        }
        function eraseCookie(name) {
            document.cookie = name + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }
        // ====================== FIREBASE CONFIG ======================
        const firebaseConfig = {
            apiKey: "AIzaSyBIIWxW_jTP1BpGOaIa9atr_sFhRlz3fJ0",
            authDomain: "tienbothi.firebaseapp.com",
            databaseURL: "https://tienbothi-default-rtdb.firebaseio.com",
            projectId: "tienbothi",
            storageBucket: "tienbothi.firebasestorage.app",
            messagingSenderId: "353470247741",
            appId: "1:353470247741:web:2cf921cc96ba0353e2cb54"
        };
        let app, auth, db, currentUser = null;
        const ITEMS_PER_PAGE = 15;
        let currentTab = 0;
        let allChi = {}, allThu = {};
        let currentEditKey = null;
        let authMode = 'login';
        // ====================== INIT ======================
        function initFirebase() {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.database();
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
            auth.onAuthStateChanged(async (user) => {
                currentUser = user;
                if (user) {
                    try {
                        const token = await user.getIdToken();
                        setCookie('session_token', token, 7);
                        await ensureUserProfile(user);
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('main-app').classList.remove('hidden');
                        document.getElementById('user-info').textContent = user.email || 'User';
                        loadAllData();
                        switchTab(0);
                    } catch (err) {
                        console.error(err);
                        alert('Không thể khởi tạo hồ sơ người dùng. Vui lòng thử lại.');
                        auth.signOut();
                    }
                } else {
                    eraseCookie('session_token');
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('main-app').classList.add('hidden');
                    allChi = {};
                    allThu = {};
                }
            });
            startRealtimeClock();
        }
        async function ensureUserProfile(user) {
            const userRef = db.ref(`users/${user.uid}`);
            const snap = await userRef.once('value');
            if (!snap.exists()) {
                await userRef.set({
                    displayName: (user.email || 'Anonymous').substring(0, 49),
                    createdAt: Date.now()
                });
            }
        }
        // ====================== AUTH ======================
        function setAuthMode(mode) {
            authMode = mode;
        }
        function handleEmailPasswordAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const statusMsg = document.getElementById('email-status-msg');
            statusMsg.classList.add('hidden');
            if (authMode === 'register') {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(() => {
                        statusMsg.textContent = 'Đăng ký tài khoản thành công!';
                        statusMsg.classList.remove('hidden');
                    })
                    .catch((err) => {
                        alert('Đăng ký thất bại: ' + (err.message || 'Lỗi hệ thống'));
                    });
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .catch((err) => {
                        alert('Đăng nhập thất bại: ' + (err.message || 'Email hoặc mật khẩu không chính xác'));
                    });
            }
        }
        function logout() {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                eraseCookie('session_token');
                auth.signOut();
            }
        }
        // ====================== DATA ACCESS (tối ưu hiệu năng) ======================
        let chiListener = null, thuListener = null;
        let renderScheduled = false;
        let pendingBalance = false;

        function getUserRef(type) {
            if (!currentUser) throw new Error('Chưa đăng nhập');
            if (type !== 'chi-tieu' && type !== 'thu-nhap') throw new Error('Loại dữ liệu không hợp lệ');
            return db.ref(`users/${currentUser.uid}/${type}`);
        }

        function scheduleRender(type) {
            if (renderScheduled) return;
            renderScheduled = true;
            requestAnimationFrame(() => {
                renderScheduled = false;
                if (type === 'chi-tieu' || type === 'both') renderAuditLog('chi-tieu', 1);
                if (type === 'thu-nhap' || type === 'both') renderAuditLog('thu-nhap', 1);
                if (pendingBalance) {
                    pendingBalance = false;
                    calculateBalance();
                }
            });
        }

        function loadAllData() {
            if (!currentUser) return;
            // Hủy listener cũ tránh memory leak
            if (chiListener) getUserRef('chi-tieu').off('value', chiListener);
            if (thuListener) getUserRef('thu-nhap').off('value', thuListener);

            chiListener = getUserRef('chi-tieu').on('value', snap => {
                allChi = snap.val() || {};
                pendingBalance = true;
                scheduleRender('chi-tieu');
            }, err => console.error(err));

            thuListener = getUserRef('thu-nhap').on('value', snap => {
                allThu = snap.val() || {};
                pendingBalance = true;
                scheduleRender('thu-nhap');
            }, err => console.error(err));
        }

        function calculateBalance() {
            let totalThu = 0, totalChi = 0;
            const thuVals = Object.values(allThu);
            const chiVals = Object.values(allChi);
            for (let i = 0; i < thuVals.length; i++) totalThu += Number(thuVals[i].so_tien || 0);
            for (let i = 0; i < chiVals.length; i++) totalChi += Number(chiVals[i].so_tien || 0);
            const fmt = n => n.toLocaleString('vi-VN') + ' đ';
            document.getElementById('audit-total-thu').textContent = fmt(totalThu);
            document.getElementById('audit-total-chi').textContent = fmt(totalChi);
            document.getElementById('audit-balance').textContent = fmt(totalThu - totalChi);
        }
        // ====================== RENDER (tối ưu DOM + GPU) ======================
        function renderAuditLog(type, page) {
            const data = type === 'chi-tieu' ? allChi : allThu;
            const isChi = type === 'chi-tieu';
            const container = document.getElementById(isChi ? 'audit-log-chi' : 'audit-log-thu');
            const pagContainer = document.getElementById(isChi ? 'pagination-chi' : 'pagination-thu');

            // Sắp xếp nhanh hơn (ưu tiên thoi_gian nếu có)
            const sortedKeys = Object.keys(data).sort((a, b) => {
                const ta = data[a].thoi_gian || new Date(data[a].ngay || 0).getTime() || 0;
                const tb = data[b].thoi_gian || new Date(data[b].ngay || 0).getTime() || 0;
                return tb - ta;
            });

            const totalPages = Math.ceil(sortedKeys.length / ITEMS_PER_PAGE) || 1;
            const start = (page - 1) * ITEMS_PER_PAGE;
            const pageKeys = sortedKeys.slice(start, start + ITEMS_PER_PAGE);

            if (pageKeys.length === 0) {
                container.innerHTML = `<div class="text-center py-14 text-slate-400 text-xs font-medium bg-white rounded-2xl border border-slate-200/60 shadow-sm">Chưa có chứng từ giao dịch nào được ghi nhận.</div>`;
                pagContainer.innerHTML = '';
                return;
            }

            // Group theo ngày
            const groupedData = {};
            for (let i = 0; i < pageKeys.length; i++) {
                const key = pageKeys[i];
                const item = data[key];
                const dateStr = item.ngay || 'unknown';
                if (!groupedData[dateStr]) groupedData[dateStr] = { items: [], dayTotal: 0 };
                groupedData[dateStr].items.push({ key, ...item });
                groupedData[dateStr].dayTotal += Number(item.so_tien || 0);
            }

            // Dùng DocumentFragment + 1 lần gán innerHTML (nhanh hơn nhiều)
            const frag = document.createDocumentFragment();
            const temp = document.createElement('div');
            let html = '';

            const dates = Object.keys(groupedData);
            for (let d = 0; d < dates.length; d++) {
                const date = dates[d];
                const group = groupedData[date];
                let formatDayHeader = date;
                try {
                    const dt = new Date(date);
                    if (!isNaN(dt)) {
                        formatDayHeader = dt.toLocaleDateString('vi-VN', {
                            weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric'
                        });
                    }
                } catch (e) {}

                html += `<div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden mb-2.5 list-item">
                    <div class="bg-slate-50/80 px-3.5 py-2 border-b border-slate-100 flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-600 uppercase tracking-tight">${escapeHtml(formatDayHeader)}</span>
                        <span class="text-[10px] font-extrabold ${isChi ? 'text-rose-600' : 'text-emerald-600'} bg-white px-2 py-0.5 rounded-md border border-slate-200/60">
                            Tổng ngày: ${isChi ? '-' : '+'}${group.dayTotal.toLocaleString('vi-VN')} đ
                        </span>
                    </div>
                    <div class="divide-y divide-slate-100">`;

                for (let j = 0; j < group.items.length; j++) {
                    const item = group.items[j];
                    html += `<div class="px-3.5 py-2.5 flex justify-between items-center gap-2.5">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5 mb-0.5">
                                <span class="font-bold text-sm text-slate-800 truncate">${escapeHtml(item.danh_muc || '')}</span>
                                ${item.ghi_chu ? `<span class="bg-indigo-50 text-indigo-600 font-semibold px-1.5 py-0.5 rounded text-[9px] uppercase tracking-wide truncate max-w-[80px] border border-indigo-100">${escapeHtml(item.ghi_chu)}</span>` : ''}
                            </div>
                            <div class="text-xs text-slate-500 truncate">${escapeHtml(item.mo_ta || '')}</div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <span class="font-extrabold text-sm ${isChi ? 'text-rose-600' : 'text-emerald-600'}">
                                ${isChi ? '-' : '+'}${Number(item.so_tien || 0).toLocaleString('vi-VN')}
                            </span>
                            <div class="flex gap-1 border-l border-slate-200/60 pl-1.5">
                                <button onclick="editItem('${type}','${item.key}')" class="p-1.5 text-slate-400 active:scale-90 bg-slate-50 rounded-lg">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                </button>
                                <button onclick="deleteItem('${type}','${item.key}')" class="p-1.5 text-slate-400 active:scale-90 bg-slate-50 rounded-lg">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>`;
                }
                html += `</div></div>`;
            }

            temp.innerHTML = html;
            while (temp.firstChild) frag.appendChild(temp.firstChild);
            container.innerHTML = '';
            container.appendChild(frag);

            // Pagination
            pagContainer.innerHTML = '';
            if (totalPages > 1) {
                const pFrag = document.createDocumentFragment();
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    btn.className = `w-8 h-8 rounded-xl text-xs font-bold flex items-center justify-center ${i === page ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'}`;
                    btn.onclick = () => renderAuditLog(type, i);
                    pFrag.appendChild(btn);
                }
                pagContainer.appendChild(pFrag);
            }
        }
        // ====================== TAB ======================
        function switchTab(tab) {
            currentTab = tab;
            const btn0 = document.getElementById('tab-0');
            const btn1 = document.getElementById('tab-1');
            if (tab === 0) {
                btn0.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-indigo-600 text-white shadow-md";
                btn1.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-indigo-300 hover:text-white bg-transparent";
                document.getElementById('content-0').classList.remove('hidden');
                document.getElementById('content-1').classList.add('hidden');
            } else {
                btn1.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-indigo-600 text-white shadow-md";
                btn0.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-indigo-300 hover:text-white bg-transparent";
                document.getElementById('content-1').classList.remove('hidden');
                document.getElementById('content-0').classList.add('hidden');
            }
        }
        // ====================== MODAL & CRUD ======================
        function showAddModal() {
            currentEditKey = null;
            document.getElementById('modal-title').textContent = currentTab === 0 ? 'Ghi nhận Khoản Chi Tiêu' : 'Ghi nhận Khoản Tiền Nhận Về';
            document.getElementById('node-type').value = currentTab === 0 ? 'chi-tieu' : 'thu-nhap';
            document.getElementById('edit-form').reset();
            
            const now = new Date();
            document.getElementById('ngay').value = now.toISOString().split('T')[0];
            showSheet();
        }
        function editItem(type, key) {
            if (!currentUser) return;
            currentEditKey = key;
            document.getElementById('node-type').value = type;
            document.getElementById('modal-title').textContent = 'Điều chỉnh Chứng từ Giao Dịch';
            getUserRef(type).child(key).once('value', snap => {
                const d = snap.val();
                if (d) {
                    document.getElementById('ngay').value = d.ngay || '';
                    document.getElementById('danh_muc').value = d.danh_muc || '';
                    document.getElementById('mo_ta').value = d.mo_ta || '';
                    document.getElementById('so_tien').value = d.so_tien || '';
                    document.getElementById('ghi_chu').value = d.ghi_chu || '';
                    showSheet();
                }
            }).catch(err => {
                alert('Không thể tải dữ liệu chứng từ.');
            });
        }
        function showSheet() {
            const backdrop = document.getElementById('modal-backdrop');
            const sheet = document.getElementById('modal');
            backdrop.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.add('opacity-100');
                sheet.classList.add('show');
            }, 10);
        }
        function hideModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const sheet = document.getElementById('modal');
            backdrop.classList.remove('opacity-100');
            sheet.classList.remove('show');
            setTimeout(() => { backdrop.classList.add('hidden'); }, 300);
        }
        function sanitizePayload() {
            const danh_muc = document.getElementById('danh_muc').value.trim().substring(0, 100);
            const mo_ta = document.getElementById('mo_ta').value.trim().substring(0, 300);
            const ngay = document.getElementById('ngay').value;
            const so_tien = parseInt(document.getElementById('so_tien').value, 10) || 0;
            const ghi_chu = document.getElementById('ghi_chu').value.trim().substring(0, 80) || null;
            if (!danh_muc || !mo_ta || !ngay) {
                throw new Error('Vui lòng điền đầy đủ thông tin bắt buộc');
            }
            if (so_tien < 0 || so_tien > 999999999999) {
                throw new Error('Số tiền không hợp lệ');
            }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(ngay)) {
                throw new Error('Ngày chứng từ không hợp lệ');
            }
            return {
                danh_muc,
                mo_ta,
                ngay,
                so_tien,
                ghi_chu,
                thoi_gian: Date.now()
            };
        }
        function handleSubmit(e) {
            e.preventDefault();
            if (!currentUser) {
                alert('Bạn chưa đăng nhập');
                return;
            }
            try {
                const type = document.getElementById('node-type').value;
                const payload = sanitizePayload();
                const ref = getUserRef(type);
                const promise = currentEditKey 
                    ? ref.child(currentEditKey).update(payload)
                    : ref.push(payload);
                promise
                    .then(() => hideModal())
                    .catch(err => {
                        alert('Lỗi lưu dữ liệu: ' + (err.message || 'Lỗi kết nối'));
                    });
            } catch (err) {
                alert(err.message);
            }
        }
        function deleteItem(type, key) {
            if (!currentUser) return;
            if (!confirm('Xóa vĩnh viễn chứng từ giao dịch này?')) return;
            getUserRef(type).child(key).remove()
                .catch(err => {
                    alert('Không thể xóa: ' + (err.message || 'Lỗi quyền truy cập'));
                });
        }
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        window.onload = initFirebase;
    </script>
</body>
</html>
